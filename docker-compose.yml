name: smartautoparts

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-this-secret-key}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      SERVE_MEDIA_FILES: "${SERVE_MEDIA_FILES:-1}"
      DJANGO_ALLOWED_HOSTS: >-
        ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: >-
        ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DB_ENGINE: postgresql
      POSTGRES_DB: "${POSTGRES_DB:-smartautoparts}"
      POSTGRES_USER: "${POSTGRES_USER:-smartautoparts}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-smartautoparts}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/media
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-sol}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"
      COLLECT_STATIC: "${COLLECT_STATIC:-1}"
      CREATE_TEST_DATA: "${CREATE_TEST_DATA:-0}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./media:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-smartautoparts}"
      POSTGRES_USER: "${POSTGRES_USER:-smartautoparts}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-smartautoparts}"
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  static_data:
