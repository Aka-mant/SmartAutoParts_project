<div class="card border-0 shadow-sm h-100">
    <div class="card-body p-4">
        <div class="d-flex align-items-center mb-3">
            <div class="rounded-3 bg-success-subtle text-success p-3 me-3">
                <i class="bi bi-robot fs-3" aria-hidden="true"></i>
            </div>
            <div>
                <h2 class="h5 mb-1">AI-помощник</h2>
                <p class="text-muted small mb-0">
                    Технические ответы и общение с сообществом.
                </p>
            </div>
        </div>

        <div class="d-grid gap-2">
            {% if is_ai_moderator %}
                <a href="{% url 'admin:index' %}" class="btn btn-outline-success">
                    <i class="bi bi-shield-check me-2" aria-hidden="true"></i>
                    Перейти к модерации
                </a>
            {% elif has_chat_access %}
                <a href="{% url 'ai_web:chat' %}" class="btn btn-success">
                    <i class="bi bi-robot me-2" aria-hidden="true"></i>
                    Открыть AI-помощник
                </a>
            {% else %}
                <a href="{% url 'subscriptions_web:plans' %}" class="btn btn-primary">
                    Выбрать тариф
                </a>
            {% endif %}

            <a href="{% url 'chat_web:rooms' %}" class="btn btn-outline-success">
                <i class="bi bi-people me-2" aria-hidden="true"></i>
                Чат сообщества
            </a>
        </div>
    </div>
</div>
