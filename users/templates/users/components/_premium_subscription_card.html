<article class="dashboard-card subscription-card is-premium {% if subscription_is_expiring %}is-expiring{% endif %}">
    <div class="subscription-card__top">
        <div><p class="dashboard-muted mb-1">Текущий тариф</p><h2 class="subscription-card__plan">{{ subscription.plan.name|default:"Premium" }}</h2></div>
        <span class="subscription-card__status">Активен</span>
    </div>
    <div class="subscription-card__details">
        <div class="subscription-card__detail"><span>Действует до</span><strong>{{ subscription.end_date|date:"d.m.Y" }}</strong></div>
        <div class="subscription-card__detail"><span>AI-запросов</span><strong>{{ ai_requests_used|default:0 }} / {{ subscription.plan.max_ai_requests|default:"∞" }}</strong></div>
    </div>
    <a class="btn btn-outline-dark w-100" href="{% url 'subscriptions:detail' %}">Управление подпиской</a>
</article>
