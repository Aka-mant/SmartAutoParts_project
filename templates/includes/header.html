<header class="site-header sticky-top">
    <nav
        class="navbar navbar-expand-lg navbar-dark"
        aria-label="Основная навигация"
    >
        <div class="container">
            <a
                class="navbar-brand d-inline-flex align-items-center gap-2"
                href="{% url 'home' %}"
            >
                <span class="brand-mark" aria-hidden="true">
                    <i class="bi bi-gear-wide-connected"></i>
                </span>

                <span>SmartAutoParts</span>
            </a>

            <button
                class="navbar-toggler border-0 shadow-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Открыть навигацию"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'home' %}"
                        >
                            Главная
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'home' %}#features"
                        >
                            Возможности
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'home' %}#pricing"
                        >
                            Тарифы
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'home' %}#reviews"
                        >
                            Отзывы
                        </a>
                    </li>

                    {% if user.is_authenticated %}
                        <li
                            class="nav-item dropdown
                                   ms-lg-2 mt-3 mt-lg-0"
                        >
                            <button
                                class="btn btn-light header-action
                                       dropdown-toggle"
                                type="button"
                                id="userDropdown"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                            >
                                <i
                                    class="bi bi-person-circle me-1"
                                    aria-hidden="true"
                                ></i>

                                {{ user.username }}
                            </button>

                            <ul
                                class="dropdown-menu dropdown-menu-end"
                                aria-labelledby="userDropdown"
                            >
                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="{% url 'users:profile_detail' %}"
                                    >
                                        <i
                                            class="bi bi-person me-2"
                                            aria-hidden="true"
                                        ></i>

                                        Профиль
                                    </a>
                                </li>

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="{% url 'users:search_history' %}"
                                    >
                                        <i
                                            class="bi bi-clock-history me-2"
                                            aria-hidden="true"
                                        ></i>

                                        История поиска
                                    </a>
                                </li>

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="{% url 'users:repair_history_list' %}"
                                    >
                                        <i
                                            class="bi bi-tools me-2"
                                            aria-hidden="true"
                                        ></i>

                                        История ремонта
                                    </a>
                                </li>

                                <li>
                                    <hr class="dropdown-divider">
                                </li>

                                <li>
                                    <form
                                        method="post"
                                        action="{% url 'users:logout' %}"
                                    >
                                        {% csrf_token %}

                                        <button
                                            class="dropdown-item text-danger"
                                            type="submit"
                                        >
                                            <i
                                                class="bi bi-box-arrow-right me-2"
                                                aria-hidden="true"
                                            ></i>

                                            Выйти
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    {% else %}
                        <li
                            class="nav-item ms-lg-2 mt-3 mt-lg-0 d-grid"
                        >
                            <a
                                class="btn btn-light header-action"
                                href="{% url 'users:login' %}"
                            >
                                <i
                                    class="bi bi-box-arrow-in-right me-1"
                                    aria-hidden="true"
                                ></i>

                                Войти
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
</header>
